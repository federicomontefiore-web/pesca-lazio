name: meteo
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch.mjs
      - name: Salva i dati
        run: |
          git config user.name "meteo-bot"
          git config user.email "meteo-bot@users.noreply.github.com"
          git add data/meteo.json
          git diff --cached --quiet || (git commit -m "dati meteo aggiornati" && git push)
